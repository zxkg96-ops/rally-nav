name: Сборка APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Установка Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Сборка APK
        run: gradle --no-daemon assembleDebug

      - name: Загрузка APK
        uses: actions/upload-artifact@v4
        with:
          name: rally-nav-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Автотесты
        run: gradle --no-daemon testDebugUnitTest

      - name: Отчёт тестов (если упали)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
